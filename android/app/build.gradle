plugins { id 'com.android.application' }

android {
    namespace 'io.github.westw0od.taobaocoins'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.westw0od.taobaocoins'
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName '0.1.2-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Preview builds use this machine's local key; no private key is in Git.
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    buildFeatures { buildConfig true }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
}
